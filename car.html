<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Мой транспорт — карточка автомобиля</title>
<meta name="theme-color" content="#0B0B0D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="detail-body">

  <header class="detail-topbar">
    <button class="back-btn" id="back-btn" type="button" aria-label="Назад к списку">←</button>
    <h1 id="car-title">Автомобиль</h1>
  </header>

  <main id="car-detail">

    <!-- Фото автомобиля -->
    <div class="photo-frame" id="photo-frame">
      <div class="photo-skeleton" id="photo-skeleton"></div>
    </div>

    <label class="add-row-btn photo-upload-btn" id="photo-upload-label">
      🖼️ Изменить фото
      <input type="file" id="photo-input" accept="image/*" hidden>
    </label>

    <!-- Название + статус -->
    <div class="detail-heading">
      <h2 id="car-name">—</h2>
      <span class="status-chip" id="car-status"><span class="dot"></span>—</span>
    </div>

    <!-- Основные данные -->
    <section class="card info-grid" id="info-grid">
      <div class="info-cell"><span class="info-label">Марка</span><span class="info-value" id="info-make">—</span></div>
      <div class="info-cell"><span class="info-label">Модель</span><span class="info-value" id="info-model">—</span></div>
      <div class="info-cell"><span class="info-label">Год</span><span class="info-value" id="info-year">—</span></div>
      <div class="info-cell info-cell-wide"><span class="info-label">VIN</span><span class="info-value info-mono" id="info-vin">—</span></div>
      <div class="info-cell"><span class="info-label">Госномер</span><span class="info-value info-mono" id="info-plate">—</span></div>
      <div class="info-cell"><span class="info-label">Пробег</span><span class="info-value" id="info-mileage">—</span></div>
    </section>

    <!-- Расходы -->
    <section class="section">
      <div class="section-head">
        <h3>Расходы</h3>
        <span class="section-total" id="expenses-total">0 ₽</span>
      </div>

      <button class="add-row-btn" id="toggle-expense-form" type="button">+ Добавить расход</button>

      <form class="inline-form" id="expense-form" hidden>
        <div class="form-row">
          <label>Дата
            <input type="date" name="date" required>
          </label>
          <label>Категория
            <select name="category" required>
              <option value="Топливо">Топливо</option>
              <option value="Ремонт">Ремонт</option>
              <option value="Обслуживание">Обслуживание</option>
              <option value="Страховка">Страховка</option>
              <option value="Штрафы">Штрафы</option>
              <option value="Прочее">Прочее</option>
            </select>
          </label>
        </div>
        <label>Сумма, ₽
          <input type="number" name="amount" min="0" step="1" placeholder="0" required>
        </label>
        <label>Комментарий
          <input type="text" name="note" placeholder="Необязательно">
        </label>
        <div class="form-actions">
          <button type="button" class="btn-ghost" id="cancel-expense-form">Отмена</button>
          <button type="submit" class="btn-accent">Добавить</button>
        </div>
      </form>

      <div class="stack" id="expenses-list"></div>
    </section>

    <!-- История ремонтов -->
    <section class="section">
      <div class="section-head">
        <h3>История ремонтов</h3>
      </div>
      <p class="section-hint">Ремонты — это расходы с категорией «Ремонт». Чтобы добавить запись, используйте форму «Расходы» выше.</p>
      <div class="stack" id="repairs-list"></div>
    </section>

    <!-- Напоминания -->
    <section class="section">
      <div class="section-head">
        <h3>Напоминания</h3>
      </div>

      <button class="add-row-btn" id="toggle-reminder-form" type="button">+ Добавить напоминание</button>

      <form class="inline-form" id="reminder-form" hidden>
        <div class="form-row">
          <label>Тип
            <select name="type" required>
              <option value="tech">ТО</option>
              <option value="insurance">Страховка</option>
              <option value="oil">Масло</option>
              <option value="tires">Шины</option>
            </select>
          </label>
          <label>Дата
            <input type="date" name="dueDate" required>
          </label>
        </div>
        <label>Комментарий
          <input type="text" name="note" placeholder="Необязательно">
        </label>
        <div class="form-actions">
          <button type="button" class="btn-ghost" id="cancel-reminder-form">Отмена</button>
          <button type="submit" class="btn-accent">Добавить</button>
        </div>
      </form>

      <div class="stack" id="reminders-list"></div>
    </section>

    <!-- Опасная зона -->
    <section class="section">
      <div class="section-head">
        <h3>Опасная зона</h3>
      </div>
      <button class="btn-danger" id="delete-car-btn" type="button">🗑 Удалить автомобиль насовсем</button>
    </section>

  </main>

  <script src="icons.js"></script>
  <script src="db.js"></script>
  <script src="storage.js"></script>
  <script src="car.js"></script>
</body>
</html>
