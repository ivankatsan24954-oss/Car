<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Мой транспорт</title>
<meta name="theme-color" content="#0A0B0D">
<meta name="description" content="Учёт транспорта: расходы, ремонты, напоминания">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <h1>Мой транспорт</h1>
    <p class="topbar-sub" id="fleet-count">— автомобилей в парке</p>
    <button class="icon-btn topbar-bell-btn" id="reminders-btn" type="button" aria-label="Напоминания">
      🔔<span class="bell-badge" id="reminders-badge" hidden></span>
    </button>
    <button class="icon-btn topbar-menu-btn" id="menu-btn" type="button" aria-label="Ещё">⋮</button>
  </header>

  <main class="list" id="vehicle-list" aria-live="polite">
    <!-- карточки автомобилей рендерятся через script.js -->
  </main>

  <button class="fab" id="add-vehicle-btn" type="button">
    <span class="fab-icon" aria-hidden="true">+</span>
    <span class="fab-label">Добавить автомобиль</span>
  </button>

  <!-- Модалка: добавить автомобиль -->
  <div class="modal-overlay" id="add-vehicle-overlay" hidden>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="add-vehicle-title">
      <div class="modal-head">
        <h2 id="add-vehicle-title">Новый автомобиль</h2>
        <button class="icon-btn" id="close-add-vehicle" type="button" aria-label="Закрыть">✕</button>
      </div>

      <form class="modal-form" id="add-vehicle-form">
        <label>Тип транспорта
          <select name="type">
            <option value="car">Легковой</option>
            <option value="van">Микроавтобус</option>
            <option value="pickup">Пикап</option>
            <option value="excavator">Спецтехника</option>
            <option value="moto">Мото</option>
          </select>
        </label>

        <div class="form-row">
          <label>Марка
            <input type="text" name="make" placeholder="Toyota" autocomplete="off">
          </label>
          <label>Модель
            <input type="text" name="model" placeholder="Camry" autocomplete="off">
          </label>
        </div>

        <label>Название карточки
          <input type="text" name="name" placeholder="Необязательно — по умолчанию марка + модель" autocomplete="off">
        </label>

        <div class="form-row">
          <label>Год
            <input type="number" name="year" placeholder="2022" min="1950" max="2100">
          </label>
          <div class="plate-field-group">
            <span class="plate-field-label">Госномер</span>
            <div class="plate-field-inputs">
              <div class="plate-input-ghost-wrap plate-main">
                <input type="text" name="plate" id="add-plate-input" autocomplete="off" spellcheck="false" aria-label="Госномер">
                <div class="plate-input-ghost" id="add-plate-ghost" aria-hidden="true"></div>
              </div>
              <div class="plate-input-ghost-wrap plate-region">
                <input type="text" name="plateRegion" id="add-plate-region-input" autocomplete="off" spellcheck="false" inputmode="numeric" aria-label="Регион">
                <div class="plate-input-ghost" id="add-plate-region-ghost" aria-hidden="true"></div>
              </div>
            </div>
          </div>
        </div>

        <label>VIN
          <input type="text" name="vin" placeholder="Необязательно" autocomplete="off">
        </label>

        <div class="form-row">
          <label>Пробег
            <input type="number" name="mileage" placeholder="0" min="0">
          </label>
          <label>Единицы
            <select name="unit">
              <option value="км">км</option>
              <option value="м/ч">м/ч (моточасы)</option>
            </select>
          </label>
        </div>

        <label>Статус
          <select name="status">
            <option value="ok">На ходу</option>
            <option value="repair">Ремонт</option>
            <option value="sold">Продан</option>
          </select>
        </label>

        <label>Фото
          <input type="file" name="photo" accept="image/*">
        </label>

        <div class="form-actions">
          <button type="button" class="btn-ghost" id="cancel-add-vehicle">Отмена</button>
          <button type="submit" class="btn-accent">Добавить</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Уведомление: скорые и просроченные напоминания -->
  <div class="modal-overlay" id="reminders-overlay" hidden>
    <div class="modal-sheet modal-sheet-small" role="dialog" aria-modal="true" aria-labelledby="reminders-title">
      <div class="modal-head">
        <h2 id="reminders-title">🔔 Напоминания</h2>
        <button class="icon-btn" id="close-reminders-modal" type="button" aria-label="Закрыть">✕</button>
      </div>
      <div class="stack" id="reminders-modal-list"></div>
    </div>
  </div>

  <!-- Меню: резервная копия -->
  <div class="modal-overlay" id="menu-overlay" hidden>
    <div class="modal-sheet modal-sheet-small" role="dialog" aria-modal="true" aria-labelledby="menu-title">
      <div class="modal-head">
        <h2 id="menu-title">Данные</h2>
        <button class="icon-btn" id="close-menu" type="button" aria-label="Закрыть">✕</button>
      </div>
      <p class="section-hint">Все данные хранятся локально на этом устройстве (IndexedDB). Сделайте резервную копию, чтобы не потерять их при переустановке приложения или смене телефона.</p>
      <div class="menu-actions">
        <button class="btn-secondary" id="export-data-btn" type="button">⭳ Скачать резервную копию</button>
        <label class="btn-secondary file-btn">
          ⭱ Восстановить из файла
          <input type="file" id="import-data-input" accept="application/json">
        </label>
      </div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="db.js"></script>
  <script src="storage.js"></script>
  <script src="script.js"></script>
</body>
</html>
